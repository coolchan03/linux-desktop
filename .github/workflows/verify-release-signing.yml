name: Verify LXDesk permanent APK signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/elegant-cray-2wtqzz
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and validate production key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lxdesk-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/lxdesk-release.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lxdesk-release.p12" >> "$GITHUB_ENV"
      - name: Build APK using permanent key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          TERMUX_APP_VERSION_NAME: 0.118.0-keycheck
          TERMUX_APK_VERSION_TAG: v0.118.0-keycheck-apt-android-7-release
        run: ./gradlew :app:assembleRelease
      - name: Verify signed Android release files
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          SIGNER="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)/apksigner"
          find app/build/outputs/apk/release -type f -name '*.apk' | grep -q .
          for apk in app/build/outputs/apk/release/*.apk; do
            "$SIGNER" verify --verbose --print-certs "$apk" | tee /tmp/lxdesk-signature.log
            grep -qi 85b8d295fde0c3d403db54dadb8266a489a055d7e4ff806d122988d0f49cf9c2 /tmp/lxdesk-signature.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lxdesk-permanently-signed-validation-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
